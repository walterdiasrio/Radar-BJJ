<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar BJJ — Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="img/banner.png" alt="Radar BJJ" class="banner">
  <nav class="menu-principal">
    <a href="/">Buscador de Atletas</a>
    <a href="/competicoes">Competições</a>
    <span id="nav-usuario" class="nav-usuario"></span>
  </nav>
</header>

<main>
  <form id="form-cadastro" class="form-auth">
    <h2>Criar conta</h2>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit">Cadastrar</button>
    <p>Já tem conta? <a href="/login">Entrar</a></p>
  </form>

  <div id="status"></div>
</main>

<script src="auth-nav.js"></script>
<script src="cadastro.js"></script>
</body>
</html>
