<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar BJJ — Cadastro</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="img/banner.png" alt="Radar BJJ" class="banner">
</header>

<div class="layout">
  <nav class="menu-lateral">
    <a href="/">Home</a>
    <a href="/buscador">Radar de Atletas</a>
    <a href="/competicoes">Competições</a>
    <a href="/noticias">BJJ News</a>
    <a href="/alertas">Meus Alertas</a>
    <a href="/carreira">Minha Carreira</a>
    <a href="/meus-alunos" id="nav-meus-alunos" style="display:none">Meus Alunos</a>
    <a href="/assinatura">Minha Assinatura</a>
    <a href="/fale-conosco">Fale Conosco</a>
    <a href="/importar-adcc" id="nav-importar-adcc" style="display:none">Importar ADCC</a>
    <a href="/importar-ajp" id="nav-importar-ajp" style="display:none">Importar AJP</a>
    <a href="/gerenciar-noticias" id="nav-gerenciar-noticias" style="display:none">Gerenciar Notícias</a>
    <a href="/gerenciar-mensagens" id="nav-gerenciar-mensagens" style="display:none">Mensagens</a>
    <div id="nav-usuario" class="nav-usuario"></div>
  </nav>

<main>
  <form id="form-cadastro" class="form-auth">
    <h2>Criar conta</h2>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required minlength="8" autocomplete="new-password">
    </div>
    <div class="campo">
      <label>Perfil</label>
      <div class="opcoes-federacao">
        <label><input type="radio" name="tipo_perfil" value="atleta" checked> Atleta</label>
        <label><input type="radio" name="tipo_perfil" value="mestre"> Mestre</label>
      </div>
      <small>Mestre tem acesso a busca por academia e alertas pra toda a equipe.</small>
    </div>
    <button type="submit">Cadastrar</button>
    <p>Já tem conta? <a href="/login">Entrar</a></p>
  </form>

  <div id="status"></div>
  </main>
</div>

<script src="auth-nav.js"></script>
<script src="cadastro.js"></script>
</body>
</html>
