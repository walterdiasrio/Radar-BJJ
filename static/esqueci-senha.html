<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar BJJ — Esqueci minha senha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="img/banner.png" alt="Radar BJJ" class="banner">
  <nav class="menu-principal">
    <a href="/">Buscador de Atletas</a>
    <a href="/competicoes">Competições</a>
    <span id="nav-usuario" class="nav-usuario"></span>
  </nav>
</header>

<main>
  <form id="form-esqueci" class="form-auth">
    <h2>Esqueci minha senha</h2>
    <p style="text-align: left; color: #7c8894; font-size: 0.85rem;">
      Informe o e-mail da sua conta. Se ele estiver cadastrado, mandamos um link pra você criar uma
      senha nova (válido por 1 hora).
    </p>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <button type="submit">Enviar link</button>
    <p><a href="/login">Voltar pro login</a></p>
  </form>

  <div id="status"></div>
</main>

<script src="auth-nav.js"></script>
<script src="esqueci-senha.js"></script>
</body>
</html>
