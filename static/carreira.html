<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar BJJ — Minha Carreira</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="img/banner.png" alt="Radar BJJ" class="banner">
</header>

<div class="layout">
  <nav class="menu-lateral">
    <a href="/">Home</a>
    <a href="/buscador">Buscador de Atletas</a>
    <a href="/competicoes">Competições</a>
    <a href="/noticias">BJJ News</a>
    <a href="/alertas">Meus Alertas</a>
    <a href="/carreira" class="ativo">Minha Carreira</a>
    <a href="/assinatura">Minha Assinatura</a>
    <a href="/importar-adcc" id="nav-importar-adcc" style="display:none">Importar ADCC</a>
    <a href="/gerenciar-noticias" id="nav-gerenciar-noticias" style="display:none">Gerenciar Notícias</a>
    <div id="nav-usuario" class="nav-usuario"></div>
  </nav>

<main>
  <h2 style="color: var(--azul); margin-bottom: 4px;">Minha Carreira</h2>
  <p style="color: #7c8894; font-size: 0.9rem; margin-top: 0;">
    Registre suas competições e acompanhe sua evolução.
  </p>

  <nav class="tabs-carreira">
    <button type="button" class="tab-carreira-btn ativo" data-tab="perfil">Perfil</button>
    <button type="button" class="tab-carreira-btn" data-tab="registrar">Registrar</button>
    <button type="button" class="tab-carreira-btn" data-tab="historico">Histórico</button>
    <button type="button" class="tab-carreira-btn" data-tab="pesquisa">Pesquisa</button>
    <button type="button" class="tab-carreira-btn" data-tab="estatisticas">Estatísticas</button>
  </nav>

  <!-- PERFIL -->
  <section id="tab-perfil" class="tab-carreira-content ativo">
    <form id="form-perfil" class="card-carreira">
      <div class="campo">
        <label for="p_avatar">Emoji/avatar</label>
        <select id="p_avatar">
          <option value="🥋">🥋 Kimono</option>
          <option value="🦖">🦖 Dino</option>
          <option value="🐲">🐲 Dragão</option>
          <option value="🦁">🦁 Leão</option>
          <option value="🐯">🐯 Tigre</option>
          <option value="🐢">🐢 Tartaruga</option>
          <option value="🏆">🏆 Campeão</option>
        </select>
      </div>
      <div class="campo">
        <label for="p_nome">Nome</label>
        <input type="text" id="p_nome" placeholder="Seu nome">
      </div>
      <div class="campo">
        <label for="p_faixa">Faixa</label>
        <select id="p_faixa">
          <option>Branca</option>
          <option>Cinza-Branca</option>
          <option>Cinza</option>
          <option>Cinza-Preta</option>
          <option>Amarela-Branca</option>
          <option>Amarela</option>
          <option>Amarela-Preta</option>
          <option>Laranja-Branca</option>
          <option>Laranja</option>
          <option>Laranja-Preta</option>
          <option>Verde-Branca</option>
          <option>Verde</option>
          <option>Verde-Preta</option>
          <option>Azul</option>
          <option>Roxa</option>
          <option>Marrom</option>
          <option>Preta</option>
        </select>
      </div>
      <div class="campo">
        <label for="p_grau">Graus (pontas na faixa)</label>
        <select id="p_grau">
          <option value="0">0</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <div class="campo">
        <label for="p_categoria">Categoria de peso</label>
        <input type="text" id="p_categoria" placeholder="ex: Pluma, Pena, Leve...">
      </div>
      <div class="campo">
        <label for="p_academia">Academia / Equipe</label>
        <input type="text" id="p_academia" placeholder="ex: Equipe Bulba BJJ">
      </div>
      <div class="campo">
        <label for="p_inicio">Praticando desde</label>
        <input type="date" id="p_inicio">
      </div>
      <button type="submit">Salvar Perfil</button>
    </form>
    <div id="status-perfil" class="status-importacao"></div>
  </section>

  <!-- REGISTRAR -->
  <section id="tab-registrar" class="tab-carreira-content">
    <form id="form-competicao" class="card-carreira">
      <input type="hidden" id="e_editing_id" value="">
      <div class="campo">
        <label for="e_data">Data</label>
        <input type="date" id="e_data" required>
      </div>
      <div class="campo">
        <label for="e_campeonato">Nome do campeonato</label>
        <input type="text" id="e_campeonato" placeholder="ex: Copa BJJ">
      </div>
      <div class="campo">
        <label for="e_categoria">Categoria (divisão/peso na época)</label>
        <input type="text" id="e_categoria" placeholder="ex: Adulto - Leve">
      </div>
      <div class="campo">
        <label for="e_pais">País</label>
        <input type="text" id="e_pais" placeholder="Brasil" value="Brasil">
      </div>
      <div class="campo">
        <label for="e_medalha">Medalha (da competição)</label>
        <select id="e_medalha">
          <option value="">Nenhuma</option>
          <option value="ouro">Ouro</option>
          <option value="prata">Prata</option>
          <option value="bronze">Bronze</option>
        </select>
      </div>

      <h3 style="color: var(--azul); font-size: 1rem;">Lutas desta competição</h3>
      <div id="lutas-container"></div>
      <button type="button" class="btn-secundario" id="btn-add-luta">+ Adicionar luta</button>

      <div style="margin-top: 16px;">
        <button type="submit" id="btn-salvar-competicao">Salvar Registro</button>
        <button type="button" class="btn-secundario hidden" id="btn-cancelar-edicao">Cancelar edição</button>
      </div>
    </form>
    <div id="status-competicao" class="status-importacao"></div>
  </section>

  <template id="template-luta-row">
    <div class="luta-row">
      <input type="text" class="luta-adversario" placeholder="Adversário">
      <select class="luta-resultado">
        <option value="vitoria">Vitória</option>
        <option value="derrota">Derrota</option>
        <option value="empate">Empate</option>
      </select>
      <select class="luta-metodo">
        <option value="pontos">Pontos</option>
        <option value="finalizacao">Finalização</option>
        <option value="wo">W.O.</option>
        <option value="desclassificacao">Desclassificação</option>
        <option value="medica">Médica</option>
      </select>
      <button type="button" class="btn-remove-luta">✕</button>
    </div>
  </template>

  <!-- HISTÓRICO -->
  <section id="tab-historico" class="tab-carreira-content">
    <div id="lista-historico"></div>
  </section>

  <!-- PESQUISA -->
  <section id="tab-pesquisa" class="tab-carreira-content">
    <form id="form-pesquisa" class="card-carreira">
      <div class="campo">
        <label for="s_campeonato">Campeonato</label>
        <input type="text" id="s_campeonato" placeholder="ex: Estadual, Copa...">
      </div>
      <div class="campo">
        <label for="s_adversario">Adversário</label>
        <input type="text" id="s_adversario" placeholder="Nome do adversário">
      </div>
      <div class="campo">
        <label for="s_de">De</label>
        <input type="date" id="s_de">
      </div>
      <div class="campo">
        <label for="s_ate">Até</label>
        <input type="date" id="s_ate">
      </div>
      <button type="submit">Buscar</button>
      <button type="button" class="btn-secundario" id="btn-limpar-pesquisa">Limpar</button>
    </form>
    <div id="contagem-pesquisa" class="status-importacao"></div>
    <div id="lista-pesquisa"></div>
  </section>

  <!-- ESTATÍSTICAS -->
  <section id="tab-estatisticas" class="tab-carreira-content">
    <div class="stats-grid" id="grade-estatisticas"></div>
    <div class="card-carreira">
      <h3 style="color: var(--azul); margin-top: 0;">Evolução de vitórias ao longo do tempo</h3>
      <svg id="grafico-evolucao" viewBox="0 0 600 240" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>
</main>
</div>

<script src="auth-nav.js"></script>
<script src="carreira.js"></script>
</body>
</html>
