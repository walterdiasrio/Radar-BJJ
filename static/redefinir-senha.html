<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar BJJ — Redefinir senha</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="img/banner.png" alt="Radar BJJ" class="banner">
</header>

<div class="layout">
  <nav class="menu-lateral">
    <a href="/">Home</a>
    <a href="/buscador">Radar de Atletas</a>
    <a href="/competicoes">Competições</a>
    <a href="/noticias">BJJ News</a>
    <a href="/alertas">Meus Alertas</a>
    <a href="/carreira">Minha Carreira</a>
    <a href="/assinatura">Minha Assinatura</a>
    <a href="/importar-adcc" id="nav-importar-adcc" style="display:none">Importar ADCC</a>
    <a href="/gerenciar-noticias" id="nav-gerenciar-noticias" style="display:none">Gerenciar Notícias</a>
    <div id="nav-usuario" class="nav-usuario"></div>
  </nav>

<main>
  <form id="form-redefinir" class="form-auth">
    <h2>Criar senha nova</h2>
    <div class="campo">
      <label for="senha">Nova senha</label>
      <input type="password" id="senha" required minlength="8" autocomplete="new-password">
    </div>
    <div class="campo">
      <label for="senha_confirma">Confirmar nova senha</label>
      <input type="password" id="senha_confirma" required minlength="8" autocomplete="new-password">
    </div>
    <button type="submit">Salvar nova senha</button>
  </form>

  <div id="status"></div>
  </main>
</div>

<script src="auth-nav.js"></script>
<script src="redefinir-senha.js"></script>
</body>
</html>
