<main>
  <form id="form-login" class="form-auth">
    <h2>Entrar</h2>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">
    </div>
    <button type="submit">Entrar</button>
    <p><a href="/esqueci-senha">Esqueci minha senha</a></p>
    <p>Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
  </form>

  <div id="status"></div>
  </main>
