<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar BJJ — Entrar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="img/banner.png" alt="Radar BJJ" class="banner">
</header>

<div class="layout">
  <nav class="menu-lateral">
    <a href="/">Home</a>
    <a href="/buscador">Buscador de Atletas</a>
    <a href="/competicoes">Competições</a>
    <a href="/noticias">BJJ News</a>
    <a href="/alertas">Meus Alertas</a>
    <a href="/assinatura">Minha Assinatura</a>
    <a href="/importar-adcc" id="nav-importar-adcc" style="display:none">Importar ADCC</a>
    <a href="/gerenciar-noticias" id="nav-gerenciar-noticias" style="display:none">Gerenciar Notícias</a>
    <div id="nav-usuario" class="nav-usuario"></div>
  </nav>

<main>
  <form id="form-login" class="form-auth">
    <h2>Entrar</h2>
    <div class="campo">
      <label for="email">E-mail</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" required autocomplete="current-password">
    </div>
    <button type="submit">Entrar</button>
    <p><a href="/esqueci-senha">Esqueci minha senha</a></p>
    <p>Ainda não tem conta? <a href="/cadastro">Cadastre-se</a></p>
  </form>

  <div id="status"></div>
  </main>
</div>

<script src="auth-nav.js"></script>
<script src="login.js"></script>
</body>
</html>
