services:
  - type: web
    name: radar-bjj
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120 --max-requests 300 --max-requests-jitter 50 --workers 2 --preload
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RESEND_API_KEY
        sync: false
      - key: URL_SITE
        value: https://www.radarbjj.com
      - key: ALERTA_REMETENTE
        value: "Radar BJJ <no-reply@radarbjj.com>"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ATLETA_MENSAL
        sync: false
      - key: STRIPE_PRICE_ATLETA_ANUAL
        sync: false
      - key: STRIPE_PRICE_MESTRE_MENSAL
        sync: false
      - key: STRIPE_PRICE_MESTRE_ANUAL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: radar-bjj-data
      mountPath: /var/data
      sizeGB: 1
